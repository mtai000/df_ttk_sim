<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角洲行动 ttk 模拟</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="tab-bar">
            <button type="button" class="tab-btn active" data-tab="tab-simulation">模拟主页</button>
            <button type="button" class="tab-btn" data-tab="tab-add">管理武器</button>
            <button type="button" class="tab-btn" data-tab="tab-data">管理子弹</button>
        </div>

        <div id="tab-simulation" class="tab-page active">
            <div class="settings-row">
                <section class="settings-section">
                    <h2>⚙️ 基础参数</h2>
                    <div class="input-row">
                        <label for="bullet_type">子弹等级：</label>
                        <select name="bullet_type" id="bullet_type">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <label for="health_point">生命值：</label>
                        <input type="number" name="health_point" id="health_point" placeholder="生命值" value="100"
                            min="0">
                    </div>
                    <div class="input-row">
                        <label for="distance">距离：</label>
                        <input type="number" name="distance" id="distance" placeholder="距离" value="20" min="0">
                    </div>
                    <div class="input-row">
                        <label for="hit_chance">命中率：</label>
                        <input type="number" id="hit_chance" name="hit_chance" value="100" min="0" max="100">
                        <span class="suffix">%</span>
                    </div>
                     <div class="input-row">
                        <label for="simulate_count">模拟次数：</label>
                        <input type="number" id="simulate_count" name="simulate_count" value="1000" min="0" max="1000000">
                    </div>
                    <div class="input-row">
                        <label for="is_print_log">打印模拟日志：</label>
                        <input type="checkbox" id="is_print_log" name="is_print_log" value="true">
                    </div>
                </section>

                <section class="settings-section">
                    <h2>🛡️ 防护装备</h2>
                    <div class="input-row">
                        <label for="helmet_lv">头盔等级：</label>
                        <select name="helmet_lv" id="helmet_lv">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <label for="helmet_point">头盔耐久：</label>
                        <input type="number" name="helmet_point" id="helmet_point" placeholder="头盔耐久" value="48"
                            min="0">
                    </div>
                    <div class="input-row">
                        <label for="armor_lv">护甲等级：</label>
                        <select name="armor_lv" id="armor_lv">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4" selected>4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <label for="armor_point">护甲耐久：</label>
                        <input type="number" name="armor_point" id="armor_point" placeholder="护甲耐久" value="110" min="0">
                    </div>
                    <div class="input-row checkbox-row">
                        <label for="is_protect_abdomen">是否保护腹部：</label>
                        <input type="checkbox" id="is_protect_abdomen" name="is_protect_abdomen" value="true" checked>
                    </div>
                    <div class="input-row checkbox-row">
                        <label for="is_protect_arms">是否有护臂：</label>
                        <input type="checkbox" id="is_protect_arms" name="is_protect_arms" value="true">
                    </div>
                </section>
            </div>

            <section class="settings-section">
                <h2>🎯 击中部位权重</h2>
                <div class="weight-group">
                    <label for="head">头</label>
                    <input type="number" id="head" name="hit_part_weight" value="5">
                    <label for="chest">胸</label>
                    <input type="number" id="chest" name="hit_part_weight" value="10">
                    <label for="abdomen">腹</label>
                    <input type="number" id="abdomen" name="hit_part_weight" value="20">
                    <label for="arm">臂</label>
                    <input type="number" id="arm" name="hit_part_weight" value="5">
                    <label for="hand">手</label>
                    <input type="number" id="hand" name="hit_part_weight" value="2">
                    <label for="leg">腿</label>
                    <input type="number" id="leg" name="hit_part_weight" value="2">
                    <label for="foot">足</label>
                    <input type="number" id="foot" name="hit_part_weight" value="1">
                </div>
            </section>

            <div class="actions-section">
                <button type="button" id="button_cal_ttk">模拟计算 ttk 对比</button>
                <button type="button" id="button_cal_ttk_according_distance">按距离对比 ttk</button>
            </div>
            <canvas id="ttkChart" width="800" height="400"></canvas>
            <canvas id="distanceChart" width="1200" height="800"></canvas>

            <section class="table-section">
                <table id="weapon_table">
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="select_all_weapons"></th>
                            <th>武器名称</th>
                            <th>基础伤害</th>
                            <th>护甲伤害</th>
                            <th>射速</th>
                            <th>子弹初速</th>
                            <th>扳机延迟</th>
                            <th>连发</th>
                            <th>部位倍率</th>
                            <th>射程衰减</th>
                            <th>秒肉伤</th>
                            <th>秒甲伤</th>
                            <th>子弹类型</th>
                            <th>删除</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- 动态生成的内容 -->
                    </tbody>
                </table>
            </section>
        </div>

        <div id="tab-add" class="tab-page">
            <section class="settings-section">
                <h1>管理武器</h1>
                <h2>📋 武器参数</h2>
                <form id="addWeaponForm">
                    <section class="settings-section">
                        <div class="input-row" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
                            <input type="text" id="newName" placeholder="武器名" required>
                            <input type="number" id="newVelocity" placeholder="子弹初速" required>
                            <input type="number" id="newBaseDamage" placeholder="基础伤害" step="0.1" required>
                            <input type="number" id="newArmorDamage" placeholder="护甲伤害" step="0.01" required>
                            <input type="number" id="newRateOfFire" placeholder="射速" step="1" required>
                            <input type="number" id="triggerDelay" placeholder="扳机延迟,单位ms" step="0.1" required>
                        </div>
                        <div class="input-row" style="margin-top: 12px; gap: 12px; flex-wrap: wrap;">
                            <label for="isBurst">是否连发:</label>
                            <input type="checkbox" id="isBurst" value="true">
                        </div>
                        <div class="input-row" id="burstSettingsContainer"
                            style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;">
                            <input type="number" id="burstCount" placeholder="连发数" step="1">
                            <input type="number" id="burstRateOfFire" placeholder="连发射速" step="1">
                            <input type="number" id="burstInterval" placeholder="连发间隔时间" step="0.1">
                        </div>
                        <div class="input-row">
                            <label for="caliberSelect">武器口径：</label>
                            <select id="caliberSelect" required>
                                <option value="">请选择口径</option>
                            </select>
                        </div>
                    </section>
                    <h3 style="margin-top: 20px;">射程衰减区间：</h3>
                    <div style="margin-bottom: 12px;">
                        <section class="settings-section">
                            <table id="decayTable" class="decayTable" style="width:100%; border-collapse: collapse;">
                                <thead>
                                    <tr>
                                        <th>起始距离</th>
                                        <th>终止距离</th>
                                        <th>衰减系数</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="decayTableBody"></tbody>
                            </table>
                        </section>
                        <button type="button" id="addSegmentBtn" style="margin-top:8px;">+ 添加区间</button>
                    </div>
                    <h3>部位倍率：</h3>
                    <section class="settings-section">
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
                            <div><label>头</label><input type="number" id="multHead" step="0.1" value="1.9" required>
                            </div>
                            <div><label>胸</label><input type="number" id="multChest" step="0.1" value="1.0" required>
                            </div>
                            <div><label>手</label><input type="number" id="multHand" step="0.1" value="0.4" required>
                            </div>
                            <div><label>腹</label><input type="number" id="multAbdomen" step="0.1" value="0.9" required>
                            </div>
                            <div><label>臂</label><input type="number" id="multArm" step="0.1" value="0.4" required>
                            </div>
                            <div><label>腿</label><input type="number" id="multLeg" step="0.1" value="0.4" required>
                            </div>
                            <div><label>足</label><input type="number" id="multFoot" step="0.1" value="0.4" required>
                            </div>
                        </div>
                    </section>

                    <div style="margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap;">
                        <button type="button" id="addNewWeaponBtn">添加武器</button>
                        <button type="button" id="cancelEditWeaponBtn" style="display: none; background: #6b7280;">取消编辑</button>
                    </div>
                    <input type="hidden" id="editingWeaponIndex" value="-1">
                </form>
            </section>

            <!-- 武器管理表格 -->
            <div id="weapons-management-container" style="margin-top: 24px;"></div>

            <section class="settings-section" style="margin-top: 24px;">
                <h2>📦 武器数据编辑 (JSON)</h2>
                <button type="button" id="toggleWeaponsJsonEditor">展开/折叠 JSON 编辑器</button>
                <div id="weaponsJsonEditorContainer" style="display: none; margin-top: 12px;">
                    <textarea id="weaponsJsonEditor" class="json-editor"></textarea>
                    <div style="margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap;">
                        <button type="button" id="saveWeaponsJson">保存武器数据</button>
                        <button type="button" id="importWeaponsBtn">导入武器</button>
                        <button type="button" id="exportWeaponsBtn">导出武器</button>
                        <button type="button" id="resetWeaponsToDefault">还原为默认</button>
                    </div>
                </div>
            </section>
        </div>

        <div id="tab-data" class="tab-page">
            <section class="settings-section">
                <h2>管理子弹</h2>
                <div class="input-row">
                    <label for="bulletCaliberSelect">武器口径：</label>
                    <select id="bulletCaliberSelect" required>
                        <option value="">请选择口径</option>
                    </select>
                </div>
                <div class="input-row">
                    <label for="newBulletName">子弹名称：</label>
                    <input type="text" id="newBulletName" placeholder="例如 7.62AP" required>
                </div>
                <div class="input-row">
                    <label for="newBulletGlobalDamage">伤害系数：</label>
                    <input type="number" id="newBulletGlobalDamage" placeholder="伤害倍率" step="0.01" required>
                </div>
                <div class="input-row">
                    <label for="newBulletGlobalArmorDamage">甲伤系数：</label>
                    <input type="number" id="newBulletGlobalArmorDamage" placeholder="护甲伤害倍率" step="0.01" value="1.0"
                        required>
                </div>
                <h3>护甲详情：</h3>
                <div class="armor-details">
                    <div class="input-row">
                        <label>护甲等级 1：</label>
                        <input type="number" id="armorDamageFactor1" placeholder="甲伤系数" step="0.01" required>
                        <input type="number" id="penetrate1" placeholder="穿透系数" step="0.01" required>
                    </div>
                    <div class="input-row">
                        <label>护甲等级 2：</label>
                        <input type="number" id="armorDamageFactor2" placeholder="甲伤系数" step="0.01" required>
                        <input type="number" id="penetrate2" placeholder="穿透系数" step="0.01" required>
                    </div>
                    <div class="input-row">
                        <label>护甲等级 3：</label>
                        <input type="number" id="armorDamageFactor3" placeholder="甲伤系数" step="0.01" required>
                        <input type="number" id="penetrate3" placeholder="穿透系数" step="0.01" required>
                    </div>
                    <div class="input-row">
                        <label>护甲等级 4：</label>
                        <input type="number" id="armorDamageFactor4" placeholder="甲伤系数" step="0.01" required>
                        <input type="number" id="penetrate4" placeholder="穿透系数" step="0.01" required>
                    </div>
                    <div class="input-row">
                        <label>护甲等级 5：</label>
                        <input type="number" id="armorDamageFactor5" placeholder="甲伤系数" step="0.01" required>
                        <input type="number" id="penetrate5" placeholder="穿透系数" step="0.01" required>
                    </div>
                    <div class="input-row">
                        <label>护甲等级 6：</label>
                        <input type="number" id="armorDamageFactor6" placeholder="甲伤系数" step="0.01" required>
                        <input type="number" id="penetrate6" placeholder="穿透系数" step="0.01" required>
                    </div>
                </div>
                <h3>部位倍率（可选，不设置则使用枪支的部位倍率）：</h3>
                <section class="settings-section" style="padding: 16px;">
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
                        <div><label>头</label><input type="number" id="bulletMultHead" step="0.1" placeholder="默认使用枪支">
                        </div>
                        <div><label>胸</label><input type="number" id="bulletMultChest" step="0.1" placeholder="默认使用枪支">
                        </div>
                        <div><label>手</label><input type="number" id="bulletMultHand" step="0.1" placeholder="默认使用枪支">
                        </div>
                        <div><label>腹</label><input type="number" id="bulletMultAbdomen" step="0.1"
                                placeholder="默认使用枪支"></div>
                        <div><label>臂</label><input type="number" id="bulletMultArm" step="0.1" placeholder="默认使用枪支">
                        </div>
                        <div><label>腿</label><input type="number" id="bulletMultLeg" step="0.1" placeholder="默认使用枪支">
                        </div>
                        <div><label>足</label><input type="number" id="bulletMultFoot" step="0.1" placeholder="默认使用枪支">
                        </div>
                    </div>
                </section>
                <button type="button" id="addNewBulletBtn">保存</button>
            </section>
            <div id="bullets-table-container"></div>
        </div>
    </div>
    </div>
    <script src="./main.js"></script>
</body>

</html>
